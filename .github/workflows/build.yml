name: Build

on:
  push:
    branches: [ "2.0", "2.1", "2.2.x", "3.0.x" ]
  pull_request:

# Two hosts, because neither can do the whole job:
#   - ubuntu-latest cannot build Apple targets at all, and
#   - macos-latest has no Docker daemon, so every Testcontainers/LocalStack test is unavailable.
# The Kotlin plugin skips target tasks the host cannot support, so each job covers what it can and
# the union is the real matrix. See §6.1 of NATIVE-AWS-CLIENT-PLAN.md.
jobs:
  linux:
    name: Linux (JVM, LocalStack, linuxX64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # The full suite: JVM tests, the Docker-gated LocalStack suites, the linuxX64 native tests,
      # and `checkLegacyAbi`.
      - name: Build
        run: ./gradlew build

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: '**/build/test-results/**/*.xml'

  macos:
    name: macOS (Apple targets, macosArm64 native tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Explicit task list rather than `build`: `build` would pull in the Docker-gated JVM suites,
      # which cannot run on a macOS runner. These are the tasks that exist only on this host.
      - name: Native and Apple target tests
        run: >
          ./gradlew
          macosArm64Test
          iosSimulatorArm64Test
          compileKotlinLinuxArm64

      # linuxArm64 is Tier 2 with test execution unsupported, so linking is the only static check
      # available for the architecture that actually ships. Cross-compiles cleanly from macOS.
      - name: Link the deployment target
        run: ./gradlew :lambda:lambda-native-smoke:linkReleaseExecutableLinuxArm64

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: '**/build/test-results/**/*.xml'

  # The ONLY coverage linuxArm64 ever receives. Everything above is compile-verified or tested on a
  # proxy architecture; this deploys the real binary to Lambda on Graviton and invokes it.
  #
  # Requires the AWSKT_SMOKE_ROLE_ARN secret (an OIDC role that may create the smoke table, role,
  # layer and function). Skipped rather than failed when the secret is absent, so forks still build.
  deployed-smoke:
    name: Deployed Lambda smoke (linuxArm64 on Graviton)
    runs-on: ubuntu-latest
    needs: [ linux ]
    if: github.ref == 'refs/heads/3.0.x'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check for AWS credentials
        id: creds
        run: |
          if [ -n "${{ secrets.AWSKT_SMOKE_ROLE_ARN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWSKT_SMOKE_ROLE_ARN is not set — skipping the deployed-Lambda smoke."
          fi

      # The libcrypt layer is extracted from the arm64 amazonlinux:2 image, which needs binfmt
      # emulation on an x86_64 runner.
      - name: Set up QEMU for arm64
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure AWS credentials
        if: steps.creds.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWSKT_SMOKE_ROLE_ARN }}
          aws-region: us-west-2

      - name: Package the Lambda and the libcrypt layer
        if: steps.creds.outputs.available == 'true'
        run: >
          ./gradlew
          :lambda:lambda-native-smoke:packageLambda
          :lambda:lambda-native-smoke:packageNativeLayer

      - name: Deploy and invoke
        if: steps.creds.outputs.available == 'true'
        env:
          AWSKT_LIVE_SMOKE: "1"
          AWS_REGION: us-west-2
        run: ./.github/scripts/native-smoke.sh
