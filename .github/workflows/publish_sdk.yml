name: Publish

# Automatic triggers disabled: builds are run locally instead. Restore the key below to re-enable.
#
# This is the release path. The Publish-to-Central and Create-GitHub-Release steps further down are
# themselves still commented out, so this workflow currently only builds — but re-enable BOTH this
# trigger and those steps before cutting a release, or a push to a release branch will silently
# produce no artifacts.
#
# on:
#   push:
#     branches:
#     - '[0-9]+.[0-9]+.x'
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - name: Write Nexus Key
        id: nexus_gpg_file
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'nexus-key.gpg'
          encodedString: ${{ secrets.NEXUSKEY64 }}

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Gradle Build
        run: ./gradlew build -x test
#
#      - name: Publish to Central
#        run: ./gradlew final  -Psigning.keyId="${{ secrets.SIGNING_KEYID }}" -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" -Psigning.secretKeyRingFile="${{ steps.nexus_gpg_file.outputs.filePath }}" -PmavenCentralUsername="${{ secrets.MAVEN_CENTRAL_USER }}" -PmavenCentralPassword="${{ secrets.MAVEN_CENTRAL_PASSWORD }}"
